<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Rate Trip Dashboard</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="brand">
        <span class="dot"></span>
        <span class="brand-label">RateTrip</span>
      </div>
      <h1>Selamat Datang</h1>
      <p class="login-sub">Masuk untuk mengakses dashboard monitoring</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="nama@email.com" 
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••" 
          required
          autocomplete="current-password"
        >
      </div>

      <div id="loginError" class="login-error"></div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text">Masuk</span>
        <span class="btn-loader" style="display:none;">&#8987;</span>
      </button>
    </form>

    <div class="login-footer">
      <p>Akun dibuat oleh administrator.</p>
    </div>
  </div>
</div>

<script type="module" src="/src/login.js"></script>
</body>
</html>
